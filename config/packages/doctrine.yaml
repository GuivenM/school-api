doctrine:
    dbal:
        default_connection: default
        connections:
            # Base centrale ("landlord") : écoles (tenants), super-admins...
            # Garde le nom "default" pour ne rien casser (messenger doctrine://default, migrations...).
            # L'utilisateur MySQL doit pouvoir créer des bases et des utilisateurs (voir docs/multi-tenant.md).
            default:
                url: '%env(resolve:DATABASE_URL)%'

                # IMPORTANT: You MUST configure your server version,
                # either here or in the DATABASE_URL env var (see .env file)
                #server_version: '16'

                profiling_collect_backtrace: '%kernel.debug%'
            # Base de l'école courante : dbname/user/password sont remplacés à la connexion
            # par App\Tenancy\Doctrine\TenantDriverMiddleware (voir TENANT_DATABASE_URL).
            tenant:
                url: '%env(resolve:TENANT_DATABASE_URL)%'
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        default_entity_manager: default
        entity_managers:
            # Entités de la base centrale : src/Entity
            default:
                connection: default
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                auto_mapping: true
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
            # Entités présentes dans CHAQUE base d'école : src/Tenant/Entity
            tenant:
                connection: tenant
                validate_xml_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore
                mappings:
                    TenantDb:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Tenant/Entity'
                        prefix: 'App\Tenant\Entity'

when@test:
    doctrine:
        dbal:
            connections:
                default:
                    # "TEST_TOKEN" is typically set by ParaTest
                    dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                tenant:
                    # Cache de requêtes (DQL -> SQL) : sans risque, partagé entre écoles.
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    # PAS de result_cache_driver ici : ses clés ne contiennent pas l'école,
                    # un cache de résultats partagé mélangerait les données entre écoles.

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
